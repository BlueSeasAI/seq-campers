[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# quote-email sends the buyer their own copy of the indicative quote. It reads
# RESEND_API_KEY from the environment and no-ops without it, so the site is
# safe to deploy before the Resend domain is verified. Route is declared in
# the function's own `config.path` (/api/quote-email).

# Astro emits clean URLs (e.g. /stock/foo/index.html). No extra redirects
# needed for routing. The Netlify form submission redirect lives on the
# form itself (action="/thanks/") so it survives static deploys.

# The Kruiser quote builder was renamed /quote/kruiser-t -> /quote/kruiser
# (it now lists all 3 models). 301 the old path so printed Brisbane-show QR
# codes, shared-spec links and bookmarks keep working. Query strings are
# preserved automatically.
[[redirects]]
  from = "/quote/kruiser-t"
  to = "/quote/kruiser/"
  status = 301
[[redirects]]
  from = "/quote/kruiser-t/*"
  to = "/quote/kruiser/"
  status = 301
# kruiser-s retired - all S-Class models now live on /quote/kruiser.
[[redirects]]
  from = "/quote/kruiser-s"
  to = "/quote/kruiser/"
  status = 301
[[redirects]]
  from = "/quote/kruiser-s/*"
  to = "/quote/kruiser/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

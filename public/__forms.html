<!doctype html>
<html>
<head>
  <title>Netlify Forms decoy</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <!--
    This file exists so Netlify's static form parser can detect every form
    name we use across the site, even forms that only exist on dynamically
    generated pages (e.g. /quote/[slug], /stock/[slug]). Without this file
    a form submission can land on /thanks/ as a raw POST that Netlify never
    intercepts -> 404.

    Each form here mirrors the live form's `name` + `data-netlify` setup
    with a single required field. Netlify never serves this page to users
    (robots noindex + no internal links) - it only reads it at build time.
  -->

  <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="caravan_interest" />
    <input type="text" name="experience" />
    <input type="text" name="video_watched" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

  <form name="listing-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="customer_name" />
    <input type="email" name="customer_email" />
    <input type="tel" name="customer_phone" />
    <input type="text" name="customer_state" />
    <input type="text" name="caravan_title" />
    <input type="text" name="caravan_brand" />
    <input type="text" name="caravan_price" />
    <input type="text" name="caravan_stock_number" />
    <input type="text" name="caravan_status" />
    <input type="text" name="caravan_url" />
    <input type="text" name="tow_vehicle" />
    <input type="text" name="experience" />
    <input type="text" name="video_watched" />
    <input type="checkbox" name="send_spec_sheet" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

  <form name="brochure-download" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="customer_name" />
    <input type="email" name="customer_email" />
    <input type="tel" name="customer_phone" />
    <input type="text" name="customer_state" />
    <input type="text" name="brand_interest" />
    <input type="text" name="tow_vehicle" />
    <input type="text" name="motivation" />
    <input type="text" name="timeline" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

  <form name="workshop-booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="caravan" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

  <form name="quote-builder" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="brand" />
    <input type="text" name="model" />
    <input type="text" name="variant" />
    <input type="text" name="options" />
    <input type="text" name="estimated_price" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

  <!-- Quote builder v2 (16 Jun rebuild) - lead captured upfront via overlay,
       full spec submitted at the commit step. Two separate forms so Bart can
       distinguish "started building" leads from "completed spec" leads in
       the Netlify Forms dashboard. -->
  <form name="quote-builder-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="first_name" />
    <input type="text" name="last_name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="intent" />
    <input type="text" name="brand_name" />
    <input type="text" name="brand_slug" />
    <input type="text" name="page_url" />
    <input name="bot-field" />
  </form>

  <form name="quote-builder-v2" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="lead_first_name" />
    <input type="text" name="lead_last_name" />
    <input type="email" name="lead_email" />
    <input type="tel" name="lead_phone" />
    <input type="text" name="lead_intent" />
    <input type="text" name="brand_name" />
    <input type="text" name="brand_slug" />
    <input type="text" name="page_url" />
    <input type="text" name="variant_name" />
    <input type="text" name="variant_base_price" />
    <input type="text" name="selected_options" />
    <input type="text" name="total_indicative_price" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

</body>
</html>
